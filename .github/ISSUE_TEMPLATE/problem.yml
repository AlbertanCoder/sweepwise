name: Something is not working
description: Tell us what happened so it can be fixed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. This page is public, so please leave out names, email addresses, file names and anything else personal.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you press, and what did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sweepwise version
      description: Shown at the bottom left of the app, for example 0.1.0.
  - type: dropdown
    id: where
    attributes:
      label: Where did you get it?
      options:
        - Microsoft Store
        - GitHub download
        - Other
  - type: input
    id: system
    attributes:
      label: Your system
      description: For example Windows 11, Windows 10, Linux or macOS.
