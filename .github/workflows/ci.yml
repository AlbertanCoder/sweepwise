name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          # The oldest supported Ubuntu, so the .deb and AppImage run on as many Linux versions as possible.
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: macOS
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux web-view libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        working-directory: src-tauri
        shell: bash
        run: cargo test -- --test-threads=1 2>&1 | tee test.log

      # Read-only look at what Sweepwise sees on this real machine (changes nothing).
      - name: Real-system tour
        if: runner.os != 'Windows'
        working-directory: src-tauri
        env:
          SWEEPWISE_DATA: ${{ runner.temp }}/sweepwise-tour
        run: cargo run --example tour | tee tour.json

      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # Linux: the packages plus RESULT.json (tests, the built program's self-test), same as tools/linux_check.sh.
      - name: Linux results
        if: runner.os == 'Linux'
        run: |
          mkdir -p tools/linux
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage tools/linux/
          python3 tools/linux_result.py src-tauri/test.log tools/linux src-tauri/target/release/sweepwise

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sweepwise-Linux
          path: tools/linux/
          if-no-files-found: error
          retention-days: 14

      # Mac: the DMG plus RESULT.json (tests, the built program's self-test, the real-Mac tour).
      - name: Mac results
        if: runner.os == 'macOS'
        run: |
          mkdir -p tools/mac
          cp src-tauri/target/release/bundle/dmg/*.dmg tools/mac/
          python3 tools/mac_result.py src-tauri/test.log src-tauri/tour.json tools/mac src-tauri/target/release/sweepwise

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: sweepwise-macOS
          path: tools/mac/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: sweepwise-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
